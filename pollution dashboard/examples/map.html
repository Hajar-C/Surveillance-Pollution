<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="apple-touch-icon" sizes="76x76" href="../assets/img/apple-icon.png">

  <title>Morocco Air Quality - Map</title>

  <!-- Fonts and icons -->

  <!-- CSS -->

<body class="">

      <div class="sidebar-wrapper">
        <div class="logo">
          <a href="javascript:void(0)" class="simple-text logo-normal">Pollution Dashboard</a>
        </div>
        <ul class="nav">
          <li>
            <a href="./dashboard.html">
              <i class="tim-icons icon-chart-pie-36"></i>
              <p>Dashboard</p>
            </a>
          </li>
          <li class="active ">

              <p>Maps</p>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <div class="main-panel">
      <!-- Navbar -->
      <nav class="navbar navbar-expand-lg navbar-absolute navbar-transparent">
        <div class="container-fluid">
          <div class="navbar-wrapper">
            <div class="navbar-toggle d-inline">
              <button type="button" class="navbar-toggler">
                <span class="navbar-toggler-bar bar1"></span>
                <span class="navbar-toggler-bar bar2"></span>
                <span class="navbar-toggler-bar bar3"></span>
              </button>
            </div>
            <a class="navbar-brand" href="javascript:void(0)">Maps</a>
          </div>

          <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navigation">
            <span class="navbar-toggler-bar navbar-kebab"></span>
            <span class="navbar-toggler-bar navbar-kebab"></span>
            <span class="navbar-toggler-bar navbar-kebab"></span>
          </button>

          <div class="collapse navbar-collapse" id="navigation">
            <ul class="navbar-nav ml-auto">
              <li class="search-bar input-group">
                <button class="btn btn-link" id="search-button" data-toggle="modal" data-target="#searchModal">
                  <i class="tim-icons icon-zoom-split"></i>
                  <span class="d-lg-none d-md-block">Search</span>
                </button>
              </li>
              <li class="separator d-lg-none"></li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- Modal Search (mêmes IDs que dashboard) -->
      <div class="modal modal-search fade" id="searchModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header" style="display:block;">
              <div class="d-flex" style="gap:10px;">
                <input type="text" class="form-control" id="citySearchInput" placeholder="City Name">
                <button class="btn btn-primary" id="citySearchBtn" type="button">
                  <i class="tim-icons icon-zoom-split" ></i>
                </button>
              </div>
              <div id="citySearchMsg" class="mt-2"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- End Modal -->

      <div class="content">
        <div class="row">
          <div class="col-md-12">
            <div class="card card-plain">
              <div class="card-header">Leaflet</div>
              <div class="card-body">
                <!-- on supprime la barre search interne ici (pas besoin) -->
                <div id="map" class="map"></div>
              </div>
            </div>
          </div>

      <footer class="footer">
        <div class="container-fluid">
          <div class="copyright">

  <!-- App -->
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/pollution-map.js"></script>
